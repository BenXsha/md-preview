[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI 上的 `md-preview` 已被别的项目占用（Bootstrap 风格的浏览器预览），所以发行名带 kde 后缀；
# 命令名、仓库名、AUR 包名都仍然是 md-preview（pipx install md-preview-kde → 得到 md-preview 命令）。
name = "md-preview-kde"
version = "0.4.0"
description = "Render Markdown into styled PDF/HTML with plain-CSS themes — built for KDE Dolphin middle-click preview"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BenXsha" }]
keywords = ["markdown", "css-theme", "preview", "okular", "kde", "dolphin", "pdf", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: KDE",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
]
dependencies = [
  "markdown-it-py[linkify]>=3.0",
  "Pygments>=2.14",
]

[project.optional-dependencies]
# 只有 tools/theme-gallery.py（主题对比截图）需要
gallery = ["Pillow>=9.0"]
dev = ["pytest>=7.0", "Pillow>=9.0"]

[project.scripts]
md-preview = "md_preview.cli:main"

[project.urls]
Homepage = "https://github.com/BenXsha/md-preview"
Repository = "https://github.com/BenXsha/md-preview"
Issues = "https://github.com/BenXsha/md-preview/issues"
Changelog = "https://github.com/BenXsha/md-preview/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
md_preview = ["fallback.css", "fallback-dark.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
